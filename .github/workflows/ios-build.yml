name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build release app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -e
          echo "---- what the build produced ----"
          find build/ios -maxdepth 3 | sort || true
          if [ ! -f build/ios/ipa/Runner.ipa ]; then
            echo "Packaging Runner.app into Runner.ipa"
            mkdir -p build/ios/ipa
            rm -rf build/ios/ipa/Payload build/ios/ipa/Runner.ipa
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            ditto -c -k --keepParent Payload Runner.ipa
          fi
          ls -la build/ios/ipa
          echo "### iOS build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **kodastock-ios-ipa** artifact, unzip it, and install \`Runner.ipa\` with [Sideloadly](https://sideloadly.io) or AltStore." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodastock-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error
